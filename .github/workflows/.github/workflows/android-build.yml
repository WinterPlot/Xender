name: Build Xender APK

on:
push:
branches: [main, master]
workflow_dispatch:

permissions:
contents: read

jobs:
build:
name: Build Android APK
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Set up JDK 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Grant Gradle permission
    run: |
      if [ -f ./gradlew ]; then
        chmod +x ./gradlew
      fi

  - name: Build debug APK
    run: |
      if [ -f ./gradlew ]; then
        ./gradlew assembleDebug --stacktrace
      elif [ -f ./settings.gradle ] || [ -f ./settings.gradle.kts ]; then
        gradle assembleDebug --stacktrace
      else
        echo "ERROR: Gradle project or gradlew not found in repository root."
        find . -maxdepth 3 -name gradlew -o -name settings.gradle -o -name settings.gradle.kts
        exit 1
      fi

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: Xender-debug-APK
      path: |
        **/build/outputs/apk/debug/*.apk
      if-no-files-found: error
      retention-days: 7
