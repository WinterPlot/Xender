      ajax: function(opts){

        var options = {
          url: '',
          type: 'GET',
          data: null,
          timeout: 30,
          contentType: 'application/x-www-form-urlencoded',
          success: function(){},
          error: function(){},
          timeoutFn: function(){
            // alert("Network error,check your internet connection and try again");
          }
        };

        if(!opts.url || !opts.type){
          return;
        }

        for(var i in opts){
          options[i] = opts[i];
        }

        function callback (xhr) {
          // alert('xmlhttp.status = ' + xmlhttp.status + ' xmlhttp.readyState = ' + xmlhttp.readyState);
          var showError = function(){
            if(xmlhttp.responseText.indexOf('401') > -1){
              alert(' xmlhttp.responseText = ' + xmlhttp.responseText);
            }else{
              alert('xmlhttp.status = ' + xmlhttp.status + ' xmlhttp.responseText = ' + xmlhttp.responseText);
            }
          }
          
          xmlhttp.boxNetStatus = 1;
          if(xmlhttp.readyState == 4){
            // alert('2 = ' + xmlhttp.status);
            clearTimeout(xmlHttpTimeout); 
            // status == 0, 时可能出现问题, 本地响应, 断网时会出现
            if(xmlhttp.status == 200 || xmlhttp.status == 0){
              // alert('xmlhttp.readyState = ' + xmlhttp.readyState + ', xmlhttp.status = ' + xmlhttp.status + ', xmlhttp.responseText = ' + !!xmlhttp.responseText);
              // alert('xmlhttp.responseText = ' + xmlhttp.responseText);
              // alert('xmlhttp.response = ' + xmlhttp.response);
              // 本地响应, 断网处理
              if(xmlhttp.status == 0 && !xmlhttp.responseText){
                xmlhttp.boxNetStatus = 0;
                options.error(xmlhttp);
                
                // alert("Network error,check your internet connection and try again");
              }else{
                options.success(xmlhttp.responseText);
                clearTimeout(xmlHttpTimeout);
              }
            }else if(xmlhttp.status == 401){
              if(window.account){
                window.account.gotoLogin();
              }else{
                // showError();
                options.error(xmlhttp);
              }
            }else if(xmlhttp.status == 400){
              // showError();
              // alert("400");
              options.error(xmlhttp);
              clearTimeout(xmlHttpTimeout);
            }else{
              // 按超时处理, 不清除 clearTimeout(xmlHttpTimeout)
            }
          }
        }

        var xmlhttp = new XMLHttpRequest();

        var xmlHttpTimeout = null;


        xmlhttp.onreadystatechange = callback ;

        if(options.type=='GET'){
          var u = '';
          // console.log('data = ' + JSON.stringify(options.data));
          if(options.data){
            for(var di in options.data){
              u += di + '=' + options.data[di] + '&';
            }

            u = options.url + '?' + u.substring(0, u.length - 1);
          }else{
            u = options.url;
          }
          xmlhttp.open(options.type, u, true);
          xmlhttp.send(null);
        }else if(options.type == 'POST'){
          xmlhttp.open(options.type, options.url, true);
          xmlhttp.setRequestHeader("Content-Type", options.contentType);

          var formStr = '';
          var sp = '&';
          
          if(options.contentType == 'application/json'){
            xmlhttp.setRequestHeader('accept', options.contentType)
            formStr = options.data;
          }else{
            if(!options.data) return '';
              var pairs = [];
              for(var name in options.data){
                  if(!options.data.hasOwnProperty(name)) 
                    continue;
                  if(typeof options.data[name] === 'function') 
                    continue;

                  var value = options.data[name].toString();
                  name = encodeURIComponent(name.replace('%20','+'));
                  value = encodeURIComponent(value.replace('%20','+'));
                  pairs.push(name+'='+value);
              }
              formStr = pairs.join('&');
          }

          // xmlhttp.setRequestHeader("xbid",uuid);
          
          xmlhttp.send(formStr);

        }


        xmlHttpTimeout = setTimeout(ajaxTimeout , options.timeout * 1000);

        function ajaxTimeout(){
          xmlhttp.abort();
          options.timeoutFn();
        }

      },

        var str2=str.substring(0,1);

        }
        else if (str2=="h")

        if(o.addEventListener){
          o.addEventListener(e, fn);
        }else if(o.attachEvent){
          o.attachEvent('on' + e, fn);
        }else{
          return;
        }
      },

        if(rootPath.lastIndexOf('/') === rootPath.length - 1){
          return rootPath.substr(0, rootPath.length - 1);
        }else{
          return rootPath;
        }

      /**
       * fmt: 时间格式
       * datetime: 0时区的毫秒数
       */
      dateFormat: function (fmt, datetime) {
        var offset = new Date().getTimezoneOffset() * 60 * 100;
        var localTime = datetime + offset;
        var date = new Date(localTime);
        // console.log('offset = ' + offset, 'localTime = ' + localTime);
        // console.log('zone = ' + new Date(datetime), 'local = ' + new Date(localTime));

        var o = {
          "Y+": date.getFullYear(),
          "M+": date.getMonth() + 1, //月份
          "d+": date.getDate(), //日
          "h+": date.getHours(), //小时
          "m+": date.getMinutes(), //分
          "s+": date.getSeconds(), //秒
          "q+": Math.floor((date.getMonth() + 3) / 3), //季度
          "S": date.getMilliseconds() //毫秒
        };

        if (/(y+)/.test(fmt)){
          fmt = fmt.replace(RegExp.$1, (date.getFullYear() + "").substr(4 - RegExp.$1.length));
        }

        for (var k in o){
          if (new RegExp("(" + k + ")").test(fmt)) fmt = fmt.replace(RegExp.$1, (RegExp.$1.length == 1) ? (o[k]) : (("00" + o[k]).substr(("" + o[k]).length)));
        }
        
        return fmt;
      }
    };
